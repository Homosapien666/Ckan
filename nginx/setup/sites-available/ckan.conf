proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=cache:30m max_size=250m;
proxy_temp_path /tmp/nginx_proxy 1 2;

server {
    client_max_body_size 100M;
    location / {
        proxy_pass http://ckan:5000/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;

        # Never cache account, 2FA, administrator, dashboard or Action API responses.
        set $skip_ckan_cache 0;
        if ($uri ~ "^/(user|2fa|ckan-admin|dashboard|api)(/|$)") {
            set $skip_ckan_cache 1;
        }
        proxy_cache cache;
        proxy_cache_bypass $skip_ckan_cache $http_authorization $cookie_auth_tkt $cookie_ckan $cookie_remember_token $cookie_ckan_lab_8881 $cookie_ckan_lab_8881_remember;
        proxy_no_cache $skip_ckan_cache $http_authorization $cookie_auth_tkt $cookie_ckan $cookie_remember_token $cookie_ckan_lab_8881 $cookie_ckan_lab_8881_remember;
        proxy_cache_valid 30m;
        proxy_cache_key $host$scheme$proxy_host$request_uri;
    }
}
